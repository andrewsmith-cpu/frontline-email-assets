name: DAA Savings Summary Asset Import

on:
  push:
    paths:
      - 'daa-savings/import-manifest.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import image assets from manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p daa-savings/production

          if [[ ! -f daa-savings/import-manifest.txt ]]; then
            echo 'No import manifest found.'
            exit 0
          fi

          imported=0
          while IFS='|' read -r filename url; do
            filename="$(echo "${filename:-}" | xargs)"
            url="$(echo "${url:-}" | xargs)"

            [[ -z "$filename" ]] && continue
            [[ "$filename" == \#* ]] && continue
            [[ -z "$url" ]] && { echo "Missing URL for $filename"; exit 1; }

            case "$filename" in
              *.png|*.jpg|*.jpeg|*.webp) ;;
              *) echo "Unsupported image filename: $filename"; exit 1 ;;
            esac

            echo "Importing $filename"
            curl --fail --location --retry 3 --retry-delay 2 \
              --connect-timeout 20 --max-time 120 \
              "$url" -o "daa-savings/production/$filename"

            test -s "daa-savings/production/$filename"
            imported=$((imported + 1))
          done < daa-savings/import-manifest.txt

          echo "Imported $imported asset(s)."

      - name: Commit permanent GitHub copies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DAA Production Bot'
          git config user.email 'andrew.smith@contactdaa.com'
          git add daa-savings/production

          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi

          git commit -m 'Import DAA Savings Summary production assets'
          git push
