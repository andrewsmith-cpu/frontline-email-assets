name: Stage Jeffrey V2 Inline Asset

on:
  push:
    paths:
      - '.github/workflows/stage-jeffrey-v2-inline.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact QA image
        env:
          ASSET_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-7068-81fd-9785-5903106960a7/raw?se=2026-09-20T17%3A29%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=050fcf20-5bbf-5a6a-8540-d22230fbb3c0&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T13%3A54%3A15Z&ske=2026-09-21T13%3A54%3A15Z&sks=b&skv=2026-02-06&sig=sIZSsSv0R9OB8k7qOrD6pCk4ye07RxzSnO7H0lOpA9o%3D"
        run: |
          set -euo pipefail
          mkdir -p daa-savings/production/proofs
          curl -fL "$ASSET_URL" -o daa-savings/production/proofs/Jeffrey_Rawlins_V2_POLISH_QA.jpg
          test -s daa-savings/production/proofs/Jeffrey_Rawlins_V2_POLISH_QA.jpg
          file daa-savings/production/proofs/Jeffrey_Rawlins_V2_POLISH_QA.jpg
      - name: Commit staged asset and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/stage-jeffrey-v2-inline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage Jeffrey V2 polish QA image for inline Gmail proof"
          git push
