name: Render DAA Genie QA Proof

on:
  push:
    paths:
      - 'daa-savings/production/qa/qa_client.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow weasyprint pymupdf
          sudo apt-get update -qq
          sudo apt-get install -y fonts-gfs-didot || true

      - name: Render QA proof with existing locked renderer
        run: |
          cp daa-savings/production/batch-2026-09-18/clients.csv /tmp/clients.csv
          cp daa-savings/production/qa/qa_client.csv daa-savings/production/batch-2026-09-18/clients.csv
          python daa-savings/production/batch-2026-09-18/render_batch.py
          mkdir -p daa-savings/production/qa/rendered
          cp daa-savings/production/batch-2026-09-18/rendered/*_GENIE.jpg daa-savings/production/qa/rendered/
          cp /tmp/clients.csv daa-savings/production/batch-2026-09-18/clients.csv

      - name: Commit QA proof only
        run: |
          git config user.name "DAA QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add daa-savings/production/qa/rendered/
          if git diff --cached --quiet; then
            echo "No QA proof changes."
          else
            git commit -m "Render DAA Genie QA proof"
            git push
          fi
